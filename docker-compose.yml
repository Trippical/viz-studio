# Local run of the image against the synthetic sample bucket:
#   docker compose up --build   then open http://127.0.0.1:8000
services:
  viz-site:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      VIZ_STORAGE: local
      VIZ_LOCAL_DIR: /data
      VIZ_ROOT_PREFIX: viz/
      VIZ_ALLOWED_HOSTS: localhost,127.0.0.1
    volumes:
      - ./sample-bucket:/data:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

# Every value here is a placeholder. Copy this file, fill it in, and keep the
# filled copy out of the repo.
image:
  repository: REPLACE_ME.dkr.ecr.REPLACE_ME-region.amazonaws.com/viz-site
  tag: "0.1.0"
  pullPolicy: IfNotPresent

replicaCount: 2

bucket:
  name: REPLACE_ME-viz-bucket
  rootPrefix: viz/
  region: REPLACE_ME-region

# VIZ_ALLOWED_HOSTS: the host names the site answers to. Requests with any
# other Host header get 400. The first entry is also sent by the probes.
allowedHosts: viz.internal.example.com

# Header the company SSO proxy sets with the signed-in user (logged only).
authHeader: X-Forwarded-Email

serviceAccount:
  # Empty: use the release's full name, which is the release name itself when
  # it contains "viz-site" (helm install viz-site ... gives viz-site) and
  # "<release>-viz-site" otherwise. The IRSA trust policy must name this
  # service account: system:serviceaccount:<namespace>:<name>.
  name: ""
  # IRSA: the IAM role the pods assume (deploy/aws/server-policy.json).
  # Never grant these permissions to the node role.
  roleArn: arn:aws:iam::123456789012:role/viz-site-server

ingress:
  enabled: true
  # The site must never be internet-facing: it serves company data to anyone
  # who can reach it. Use an internal load balancer.
  className: nginx
  host: viz.internal.example.com
  rateLimitPerSecond: 10
  annotations: {}

networkPolicy:
  enabled: true
  # Namespace of the ingress controller; only it may reach the pods.
  ingressControllerNamespace: ingress-nginx
  # Egress on 443 only to these ranges. Required, must not be empty.
  # - S3 through a gateway VPC endpoint: list the S3 prefix-list CIDRs for your
  #   region (aws ec2 describe-managed-prefix-lists, name com.amazonaws.<region>.s3);
  #   a gateway endpoint has no IP of its own.
  # - STS for IRSA: the subnet CIDRs of an STS interface endpoint with private
  #   DNS, or the public STS ranges.
  # - S3 through an interface endpoint: its subnet CIDRs.
  # NetworkPolicy is only enforced if the cluster runs a policy engine
  # (EKS VPC CNI with enableNetworkPolicy=true, Calico or Cilium).
  # NodeLocal DNSCache (169.254.20.10) is not allowed by the DNS rule; add it
  # if your cluster uses it.
  egressCidrs:
    - 192.0.2.0/24  # REPLACE_ME: see the comment above
  # With the AWS Load Balancer Controller (target type ip), traffic comes from
  # the ALB's subnets, not a namespace: list those subnet CIDRs here. On ALB the
  # nginx rate-limit annotation does nothing; use a WAF rate-based rule instead.
  ingressCidrs: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 512Mi

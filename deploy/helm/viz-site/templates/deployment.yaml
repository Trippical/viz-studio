apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "viz-site.fullname" . }}
  labels:
    {{- include "viz-site.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "viz-site.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "viz-site.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "viz-site.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: viz-site
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: VIZ_STORAGE
              value: "s3"
            - name: VIZ_S3_BUCKET
              value: {{ .Values.bucket.name | quote }}
            - name: VIZ_ROOT_PREFIX
              value: {{ .Values.bucket.rootPrefix | quote }}
            - name: VIZ_ALLOWED_HOSTS
              value: {{ .Values.allowedHosts | quote }}
            - name: VIZ_AUTH_HEADER
              value: {{ .Values.authHeader | quote }}
            - name: VIZ_REQUIRE_IDENTITY
              value: {{ .Values.requireIdentity | quote }}
            - name: AWS_REGION
              value: {{ .Values.bucket.region | quote }}
            - name: AWS_STS_REGIONAL_ENDPOINTS
              value: "regional"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Probes must send an allowed Host header: the pod IP is rejected by
          # the host allow-list with 400.
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "viz-site.probeHost" . | quote }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
              httpHeaders:
                - name: Host
                  value: {{ include "viz-site.probeHost" . | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
